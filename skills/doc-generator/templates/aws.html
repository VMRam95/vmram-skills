<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --primary: #FF9900;
            --dark: #232F3E;
            --light: #F5F5F5;
            --code-bg: #1E1E1E;
            --border: #E5E7EB;
            --text: #1F2937;
            --text-muted: #6B7280;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 11pt;
            line-height: 1.6;
            color: var(--text);
            background: white;
            max-width: 210mm;
            margin: 0 auto;
            padding: 15mm;
        }

        h1 {
            color: white;
            background: linear-gradient(135deg, var(--dark) 0%, #37475A 100%);
            padding: 30px 40px;
            margin: -15mm -15mm 30px -15mm;
            border-bottom: 4px solid var(--primary);
            font-size: 24pt;
        }

        h2 {
            color: var(--dark);
            font-size: 16pt;
            margin: 35px 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--primary);
            page-break-after: avoid;
        }

        h3 {
            color: var(--dark);
            font-size: 12pt;
            margin: 25px 0 12px 0;
            page-break-after: avoid;
        }

        h4 {
            color: var(--text-muted);
            font-size: 10pt;
            margin: 18px 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        p { margin-bottom: 12px; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 15px 0;
            font-size: 9pt;
        }

        th {
            background: var(--dark);
            color: white;
            font-weight: 600;
            text-align: left;
            padding: 10px 12px;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
        }

        tr:nth-child(even) { background: var(--light); }

        pre {
            background: var(--code-bg);
            color: #D4D4D4;
            padding: 15px 18px;
            border-radius: 6px;
            overflow-x: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 8.5pt;
            line-height: 1.5;
            margin: 12px 0;
            page-break-inside: avoid;
        }

        code {
            font-family: 'JetBrains Mono', monospace;
            background: #F3F4F6;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 9pt;
            color: #DC2626;
        }

        pre code { background: none; padding: 0; color: inherit; }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin: 15px 0;
            font-size: 9pt;
        }

        .alert-warning { background: #FEF3C7; border-left: 4px solid #F59E0B; color: #92400E; }
        .alert-info { background: #DBEAFE; border-left: 4px solid #3B82F6; color: #1E40AF; }
        .alert-danger { background: #FEE2E2; border-left: 4px solid #EF4444; color: #991B1B; }

        ul, ol { margin: 10px 0 10px 20px; }
        li { margin-bottom: 6px; }
        hr { border: none; border-top: 1px solid var(--border); margin: 30px 0; }

        a { color: var(--primary); }

        .print-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--primary);
            color: var(--dark);
            border: none;
            padding: 12px 24px;
            font-size: 11pt;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
        }

        @media print {
            body { padding: 10mm; }
            h1 { margin: -10mm -10mm 20px -10mm; }
            .print-btn { display: none; }
            pre { white-space: pre-wrap; }
        }
    </style>
</head>
<body>
    <button class="print-btn" onclick="window.print()">Guardar como PDF</button>
    {{CONTENT}}
</body>
</html>

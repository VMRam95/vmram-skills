<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 11pt;
            line-height: 1.8;
            color: #333;
            background: white;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        h1 {
            font-size: 32pt;
            font-weight: 600;
            margin-bottom: 40px;
            color: #111;
        }

        h2 {
            font-size: 18pt;
            font-weight: 600;
            margin: 50px 0 20px 0;
            color: #111;
            page-break-after: avoid;
        }

        h3 {
            font-size: 14pt;
            font-weight: 500;
            margin: 35px 0 15px 0;
            color: #333;
        }

        h4 {
            font-size: 11pt;
            font-weight: 500;
            margin: 25px 0 10px 0;
            color: #666;
        }

        p { margin-bottom: 16px; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 25px 0;
            font-size: 10pt;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        th { font-weight: 600; color: #111; }

        pre {
            background: #f6f8fa;
            padding: 20px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 9pt;
            line-height: 1.5;
            margin: 20px 0;
            overflow-x: auto;
            border: 1px solid #e1e4e8;
        }

        code {
            font-family: 'JetBrains Mono', monospace;
            background: #f6f8fa;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 9pt;
        }

        pre code { background: none; padding: 0; }

        .alert {
            padding: 16px 20px;
            margin: 20px 0;
            border-left: 3px solid #333;
            background: #f9f9f9;
        }

        .alert-warning { border-color: #f0ad4e; }
        .alert-info { border-color: #5bc0de; }
        .alert-danger { border-color: #d9534f; }

        ul, ol { margin: 16px 0 16px 20px; }
        li { margin-bottom: 8px; }
        hr { border: none; border-top: 1px solid #eee; margin: 50px 0; }

        a { color: #111; }

        .print-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #111;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 10pt;
            border-radius: 4px;
            cursor: pointer;
        }

        @media print { .print-btn { display: none; } }
    </style>
</head>
<body>
    <button class="print-btn" onclick="window.print()">Guardar PDF</button>
    {{CONTENT}}
</body>
</html>

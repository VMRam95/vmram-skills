<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

        :root {
            --primary: #10B981;
            --dark: #0F172A;
            --darker: #020617;
            --light: #F0FDF4;
            --code-bg: #0F172A;
            --border: #1E293B;
            --text: #E2E8F0;
            --text-muted: #94A3B8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            font-size: 11pt;
            line-height: 1.7;
            color: #1E293B;
            background: white;
            max-width: 210mm;
            margin: 0 auto;
            padding: 15mm;
        }

        h1 {
            background: var(--darker);
            color: var(--primary);
            padding: 35px 40px;
            margin: -15mm -15mm 30px -15mm;
            font-size: 26pt;
            font-weight: 700;
            border-bottom: 4px solid var(--primary);
            font-family: 'JetBrains Mono', monospace;
        }

        h2 {
            color: var(--dark);
            font-size: 16pt;
            margin: 40px 0 20px 0;
            padding: 10px 15px;
            background: var(--light);
            border-left: 4px solid var(--primary);
            page-break-after: avoid;
        }

        h3 {
            color: var(--primary);
            font-size: 13pt;
            margin: 30px 0 15px 0;
            font-family: 'JetBrains Mono', monospace;
        }

        h4 {
            color: #64748B;
            font-size: 10pt;
            margin: 20px 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'JetBrains Mono', monospace;
        }

        p { margin-bottom: 14px; color: #334155; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
            font-size: 9pt;
            border: 2px solid var(--dark);
        }

        th {
            background: var(--dark);
            color: var(--primary);
            font-weight: 600;
            text-align: left;
            padding: 12px 15px;
            font-family: 'JetBrains Mono', monospace;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #E2E8F0;
        }

        tr:nth-child(even) { background: #F8FAFC; }

        pre {
            background: var(--code-bg);
            color: #E2E8F0;
            padding: 20px;
            border-radius: 0;
            border-left: 4px solid var(--primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 9pt;
            line-height: 1.6;
            margin: 20px 0;
            overflow-x: auto;
        }

        code {
            font-family: 'JetBrains Mono', monospace;
            background: var(--dark);
            color: var(--primary);
            padding: 3px 8px;
            border-radius: 0;
            font-size: 9pt;
        }

        pre code { background: none; padding: 0; color: inherit; }

        .alert {
            padding: 15px 20px;
            margin: 20px 0;
            font-size: 10pt;
            border: 2px solid;
        }

        .alert-warning { background: #FFFBEB; border-color: #F59E0B; color: #92400E; }
        .alert-info { background: #F0FDF4; border-color: var(--primary); color: #065F46; }
        .alert-danger { background: #FEF2F2; border-color: #EF4444; color: #991B1B; }

        ul, ol { margin: 15px 0 15px 25px; }
        li { margin-bottom: 8px; color: #334155; }
        hr { border: none; border-top: 2px dashed var(--border); margin: 40px 0; }

        a { color: var(--primary); text-decoration: none; font-weight: 500; }

        .print-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--primary);
            color: var(--dark);
            border: none;
            padding: 12px 24px;
            font-size: 10pt;
            font-weight: 600;
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
        }

        @media print {
            body { padding: 10mm; }
            h1 { margin: -10mm -10mm 20px -10mm; }
            .print-btn { display: none; }
        }
    </style>
</head>
<body>
    <button class="print-btn" onclick="window.print()">> save_pdf</button>
    {{CONTENT}}
</body>
</html>
